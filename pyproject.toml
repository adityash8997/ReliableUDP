[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-udp"
version = "0.1.0"
description = "Reliable file transfer over UDP with pluggable ARQ protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
